name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # npm 10 (bundled with Node 22) crashes resolving this tree without a lockfile ('edgesOut' bug).
      - run: npm install -g npm@11 --no-audit --no-fund
      - run: npm install --no-audit --no-fund
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # npm 10 (bundled with Node 22) crashes resolving this tree without a lockfile ('edgesOut' bug).
      - run: npm install -g npm@11 --no-audit --no-fund
      - run: npm install --no-audit --no-fund
      # next typegen writes route/param types used by tsc
      - run: npx next typegen
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # npm 10 (bundled with Node 22) crashes resolving this tree without a lockfile ('edgesOut' bug).
      - run: npm install -g npm@11 --no-audit --no-fund
      - run: npm install --no-audit --no-fund
      - run: npm test

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish screenshots + resolved lockfile to ci/screenshots-pr-<n>
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # npm 10 (bundled with Node 22) crashes resolving this tree without a lockfile ('edgesOut' bug).
      - run: npm install -g npm@11 --no-audit --no-fund
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          # Fake ID: renders the cookie banner for screenshots; gtag.js only loads after "Đồng ý".
          NEXT_PUBLIC_GA_ID: G-CITEST0000
      # Until package-lock.json is committed, publish the one CI resolved.
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 7
      - name: Mobile screenshots (360px / 390px)
        run: |
          npx playwright install --with-deps chromium
          npm start -- -p 3000 &
          npx --yes wait-on@8 http://localhost:3000/api/health --timeout 60000
          npm run screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7
      # Same files on a throwaway branch so reviewers (and tools without artifact access) can open them on GitHub.
      - name: Publish screenshots branch
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          mkdir -p screenshots && cp package-lock.json screenshots/ 2>/dev/null || true
          cd screenshots
          git init -q -b shots
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "screenshots for ${{ github.event.pull_request.head.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" shots:refs/heads/ci/screenshots-pr-${{ github.event.number }}

  # Migrations + seed + spatial smoke test on a real database.
  # Hostinger staging runs MariaDB 11.8 (checked 09/11/2026); MySQL 8 is tested too so the schema stays portable.
  db:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish generated migrations to ci/migrations-pr-<n>
    strategy:
      fail-fast: false
      matrix:
        engine: ['mariadb:11.8', 'mysql:8.0']
    services:
      db:
        image: ${{ matrix.engine }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: eatinvietnam_ci
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: eatinvietnam_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot || healthcheck.sh --connect"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/eatinvietnam_ci
      # Admin (#8): bootstrap + 2FA required + fake S3 standing in for R2 (scripts/fake-s3.mjs).
      ADMIN_BOOTSTRAP_EMAILS: admin@ci.test
      ADMIN_SETUP_CODE: ci-setup-code-2026
      ADMIN_SECRET_KEY: ci-only-secret-key-0123456789abcdef
      REQUIRE_ADMIN_2FA: '1'
      CRON_SECRET: ci-cron-secret
      R2_ENDPOINT: http://127.0.0.1:9000
      R2_BUCKET: eiv-ci
      R2_ACCESS_KEY_ID: ci
      R2_SECRET_ACCESS_KEY: ci
      R2_PUBLIC_URL: http://127.0.0.1:9000/eiv-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g npm@11 --no-audit --no-fund
      - run: npm install --no-audit --no-fund
      - name: Generate migrations from schema
        id: gen
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain src/db/migrations)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - run: npm run db:migrate
      # Same path as Hostinger staging boot: migrations already applied → no-op, then demo seed.
      - run: npm run db:boot
        env:
          MIGRATE_ON_START: '1'
          SEED_DEMO_IF_EMPTY: '1'
      - run: npm run db:smoke
      # Issue #6: every read the pages make gives the same answer from the DB as from the demo list.
      - run: npm run db:parity
      # Second boot must be a no-op (idempotent migrate, seed skipped on a non-empty DB).
      - run: npm run db:boot 2>&1 | tee boot2.log && grep -q 'demo seed skipped' boot2.log
        env:
          MIGRATE_ON_START: '1'
          SEED_DEMO_IF_EMPTY: '1'
      # Staging was seeded on 09/11, before photos/features lived in the DB. Recreate that state:
      # the boot hook must fill it in once, then do nothing, and the data must match the demo list.
      - name: Backfill a database seeded before #6
        env:
          MIGRATE_ON_START: '1'
          SEED_DEMO_IF_EMPTY: '1'
        run: |
          node -e "
            const m=require('mysql2/promise');
            (async()=>{const c=await m.createConnection(process.env.DATABASE_URL);
            await c.query('UPDATE menu_items SET photo_id = NULL');
            await c.query('DELETE FROM photos');
            await c.query('UPDATE restaurants SET features = NULL, amenities = NULL');
            await c.end();})().catch(e=>{console.error(e);process.exit(1)})"
          npm run db:boot 2>&1 | tee boot3.log && grep -q 'demo backfill: 14 restaurants updated' boot3.log
          npm run db:boot 2>&1 | tee boot4.log && grep -q 'demo backfill: nothing to do' boot4.log
          npm run db:parity
      # The real Hostinger path: Next server start → instrumentation.ts → bootDatabase().
      - name: Boot hook inside the built Next server
        if: matrix.engine == 'mariadb:11.8'
        env:
          MIGRATE_ON_START: '1'
          SEED_DEMO_IF_EMPTY: '1'
        run: |
          # The build must not read restaurants (ISR renders on first request): a dead DB proves it.
          DATABASE_URL=mysql://root:root@127.0.0.1:3999/unreachable npm run build
          node scripts/fake-s3.mjs 9000 > s3.log 2>&1 &
          npm start -- -p 3100 > server.log 2>&1 &
          npx --yes wait-on@8 http://localhost:3100/api/health --timeout 90000
          sleep 2
          cat server.log
          grep -q '\[db\] migrations up to date' server.log
          grep -q 'demo seed skipped' server.log
          curl -fsS http://localhost:3100/api/health | tee health.json
          grep -q '"restaurants":14' health.json
          grep -q '"dataSource":"db"' health.json
      - name: Pages read the database (#6)
        if: matrix.engine == 'mariadb:11.8'
        run: |
          # A change made only in the DB must show on every page type, so nothing is served from demo data.
          node -e "
            const m=require('mysql2/promise');
            (async()=>{const c=await m.createConnection(process.env.DATABASE_URL);
            await c.query(\"UPDATE restaurants SET name = 'Bún bò CI từ DB' WHERE slug = 'bun-bo-ganh-me-hoa'\");
            await c.end();})().catch(e=>{console.error(e);process.exit(1)})"
          page() { curl -fsS "http://localhost:3100$1" -o page.html && grep -q "$2" page.html || { echo "::error::$1 does not show '$2'"; exit 1; }; }
          page '/' 'Bún bò CI từ DB'
          page '/tim-kiem?q=bun+bo' 'Bún bò CI từ DB'
          page '/ban-do?q=bun+bo' 'Bún bò CI từ DB'
          page '/quan/bun-bo-ganh-me-hoa' 'Bún bò CI từ DB'
          page '/mon/bun-bo' 'Bún bò CI từ DB'
          page '/khu-vuc/quan-1' 'Bún bò CI từ DB'
          page '/api/restaurants?slugs=bun-bo-ganh-me-hoa' 'Bún bò CI từ DB'
          page '/sitemap.xml' '/quan/bun-bo-ganh-me-hoa'
          # Drafts stay hidden.
          node -e "
            const m=require('mysql2/promise');
            (async()=>{const c=await m.createConnection(process.env.DATABASE_URL);
            await c.query(\"UPDATE restaurants SET status = 'draft' WHERE slug = 'com-tam-suon-moc'\");
            await c.end();})().catch(e=>{console.error(e);process.exit(1)})"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/quan/com-tam-suon-moc)" = 404
          if curl -fsS 'http://localhost:3100/tim-kiem?q=com+tam' | grep -q '/quan/com-tam-suon-moc'; then echo '::error::draft listed in search'; exit 1; fi
      - name: Newsletter sign-up + unsubscribe against the real DB
        if: matrix.engine == 'mariadb:11.8'
        run: |
          post() { curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d "$2" "http://localhost:3100$1"; }
          test "$(post /api/newsletter '{"email":" Test@Example.com ","city":"ha-noi","consent":true}')" = 204
          test "$(post /api/newsletter '{"email":"test@example.com","city":"hue","consent":true}')" = 204
          test "$(post /api/newsletter '{"email":"x@example.com","consent":false}')" = 400
          test "$(post /api/newsletter '{"email":"x@example.com","city":"atlantis","consent":true}')" = 400
          TOKEN=$(node -e "
            const m=require('mysql2/promise');
            (async()=>{const c=await m.createConnection(process.env.DATABASE_URL);
            const [r]=await c.query('SELECT email,city,unsubscribe_token t FROM newsletter_subscribers');
            if(r.length!==1||r[0].email!=='test@example.com'||r[0].city!=='hue')throw new Error(JSON.stringify(r));
            console.log(r[0].t);await c.end();})().catch(e=>{console.error(e);process.exit(1)})")
          test "$(post /api/newsletter/unsubscribe "{\"token\":\"$TOKEN\"}")" = 204
          node -e "
            const m=require('mysql2/promise');
            (async()=>{const c=await m.createConnection(process.env.DATABASE_URL);
            const [r]=await c.query('SELECT unsubscribed_at u FROM newsletter_subscribers');
            if(!r[0].u)throw new Error('not unsubscribed');await c.end();})().catch(e=>{console.error(e);process.exit(1)})"
          grep -q 'SMTP_\* not set' server.log
      # Issue #8 acceptance criteria + security rules, against the real server, DB and (fake) R2.
      - name: Admin end-to-end (#8)
        if: matrix.engine == 'mariadb:11.8'
        run: BASE_URL=http://localhost:3100 node scripts/admin-e2e.mjs || { tail -n 80 server.log; exit 1; }
      - name: Admin screenshots (390px / 1280px)
        if: matrix.engine == 'mariadb:11.8'
        run: |
          npx playwright install --with-deps chromium
          BASE_URL=http://localhost:3100 node scripts/admin-screenshots.mjs
      - uses: actions/upload-artifact@v4
        if: always() && matrix.engine == 'mariadb:11.8'
        with:
          name: admin-screenshots
          path: admin-screenshots/
          retention-days: 7
      - name: Publish admin screenshots branch
        if: always() && matrix.engine == 'mariadb:11.8' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          [ -d admin-screenshots ] || exit 0
          cd admin-screenshots
          git init -q -b shots
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "admin screenshots for ${{ github.event.pull_request.head.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" shots:refs/heads/ci/admin-screenshots-pr-${{ github.event.number }}
      - name: Publish generated migrations + lockfile
        if: always() && steps.gen.outputs.changed == 'true' && matrix.engine == 'mariadb:11.8' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          mkdir -p /tmp/out && cp -r src/db/migrations /tmp/out/ && cp package-lock.json /tmp/out/
          cd /tmp/out
          git init -q -b out
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "migrations for ${{ github.event.pull_request.head.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" out:refs/heads/ci/migrations-pr-${{ github.event.number }}
      - name: Migrations must be committed
        if: steps.gen.outputs.changed == 'true'
        run: |
          echo "::error::src/db/schema.ts changed without a committed migration. Run 'npm run db:generate' (or copy from branch ci/migrations-pr-${{ github.event.number }}) and commit."
          exit 1
